spring.application.name=AquaBalance

# Config local opcional (archivo local.properties en la raiz del proyecto, ignorado por git).
# En produccion no existe y se usan las variables de entorno.
spring.config.import=optional:file:./local.properties
server.port=${PORT:8084}

# -- Base de datos ---------------------------------------------
# Sin valores por defecto: las credenciales SOLO vienen de variables de entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=5

# -- Correo (Gmail SMTP con contrasena de aplicacion) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

notificacion.email.destinatario=${NOTIFICACION_EMAIL_DESTINATARIO:${SPRING_MAIL_USERNAME:}}
notificacion.email.habilitado=true

# -- Correo por API HTTPS (Brevo): usar en Railway Free/Hobby, donde SMTP esta bloqueado --
# Si BREVO_API_KEY tiene valor se usa Brevo; si esta vacia se usa SMTP (Gmail).
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:AquaBalance}

# -- Seguridad -------------------------------------------------
# Secreto JWT en Base64 (32 bytes o mas). Generar con: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
# Duracion de la sesion en ms (604800000 = 7 dias)
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# URL del frontend: se usa para armar los enlaces de los correos (verificar cuenta / restablecer contrasena)
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Administrador unico (se crea al arrancar solo si aun no existe ninguno)
admin.nombre=${ADMIN_NOMBRE:Administrador}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# Origenes permitidos (CORS y WebSocket), separados por coma. Una sola fuente para todo el backend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://aquabalance-frontend.vercel.app}

# Clave para que los sensores/estaciones reales envien telemetria (cabecera X-API-Key).
# Vacia = el acceso por clave queda deshabilitado (los sensores simulados desde el panel siguen usando el JWT).
# Generar con: openssl rand -base64 32
sensores.api-key=${SENSORES_API_KEY:}